name: Weekly US Expansion Reminder

on:
  schedule:
    # Run every Monday at 9 AM EST (2 PM UTC)
    - cron: '0 14 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: 'Week number to research (1-5)'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Determine week number
        id: week
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "week=${{ github.event.inputs.week }}" >> $GITHUB_OUTPUT
          else
            # Calculate week based on start date (Jan 27, 2026 = Week 1)
            START_DATE="2026-01-27"
            CURRENT_DATE=$(date +%Y-%m-%d)
            DAYS_DIFF=$(( ($(date -d "$CURRENT_DATE" +%s) - $(date -d "$START_DATE" +%s)) / 86400 ))
            WEEK=$(( (DAYS_DIFF / 7) + 1 ))
            # Cap at week 5
            if [ $WEEK -gt 5 ]; then
              WEEK=5
            fi
            if [ $WEEK -lt 1 ]; then
              WEEK=1
            fi
            echo "week=$WEEK" >> $GITHUB_OUTPUT
          fi

      - name: Run research script
        run: |
          python scripts/research_state.py --week ${{ steps.week.outputs.week }}

      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: week${{ steps.week.outputs.week }}-research
          path: data/research/

      - name: Create issue for manual expansion
        uses: actions/github-script@v7
        with:
          script: |
            const week = '${{ steps.week.outputs.week }}';
            const weekStates = {
              '1': 'VT, NH, ME, PA, DE, MD',
              '2': 'VA, WV, DC, NC, SC, GA',
              '3': 'FL, AL, MS, LA, TN, KY, OH, IN',
              '4': 'MI, IL, WI, MN, IA, MO, KS, NE, SD, ND',
              '5': 'TX, OK, AR, CO, NM, AZ, UT, NV, MT, WY, ID, WA, OR, CA, AK, HI'
            };

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'us-expansion'
            });

            const weekTitle = `US Expansion Week ${week}: ${weekStates[week]}`;
            const alreadyExists = existingIssues.data.some(i => i.title === weekTitle);

            if (!alreadyExists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: weekTitle,
                labels: ['us-expansion', 'enhancement'],
                body: `## Week ${week} US Expansion

**States to add:** ${weekStates[week]}

### Instructions

1. Download the research artifact from this workflow run
2. Review \`data/research/week${week}_research.json\` for candidate libraries
3. Run Claude Code and say:
   \`\`\`
   Continue US expansion - Week ${week} states (${weekStates[week]})
   \`\`\`
4. Claude will:
   - Research Library of Things programs for each allowed library
   - Check ToS compliance
   - Create data files
   - Update consolidate.py and catalogUrls.js
   - Commit and push changes

### Progress

- [ ] VT - Vermont
- [ ] NH - New Hampshire
- [ ] ME - Maine
- [ ] PA - Pennsylvania
- [ ] DE - Delaware
- [ ] MD - Maryland

(Adjust checklist based on week)

### Time Estimate
~30-45 minutes of Claude Code usage (within 5% weekly budget)
`
              });
            }
